name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repo; the armv7 build is the only output.
permissions:
  contents: read

# A new push supersedes an in-flight run for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # go-version-file keeps CI on whatever go.mod asks for, so bumping the
      # module's Go version doesn't silently leave CI behind.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Separate steps rather than one `make fmt vet test armv7`, so a failure
      # names itself in the checks list instead of just "make".
      - name: gofmt
        run: make fmt

      - name: vet
        run: make vet

      - name: test
        run: make test

      # Run separately from `test` so a data race is distinguishable from an
      # ordinary failure. Host-only: -race needs cgo, so it can't run for armv7.
      - name: test (race detector)
        run: make test-race

      # The real deliverable: a static armv7 binary for the speaker. Catches
      # anything that builds on the host but not for the target.
      - name: armv7 cross-compile
        run: make armv7

      # Keep the exact binary each commit produced, so what gets deployed to the
      # speaker is traceable to a commit rather than rebuilt from a dirty tree.
      - name: upload armv7 binary
        uses: actions/upload-artifact@v7
        with:
          name: soundtouchd-armv7-${{ github.sha }}
          path: dist/soundtouchd
          if-no-files-found: error
          retention-days: 30
